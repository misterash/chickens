<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Tracker</title>
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <!-- Materialize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="modern-farm">

    <nav>
        <div class="nav-wrapper">
            <a href="#" class="brand-logo center">Egg Tracker</a>
            <ul id="nav-mobile" class="left">
                <li><a href="/archive"><i class="material-icons left">history</i>Archive</a></li>
            </ul>
            <ul id="nav-mobile" class="right">
                <li>
                    <div class="switch">
                        <label>
                            <span class="hide-on-small-only">Light</span>
                            <input type="checkbox" id="theme-switcher">
                            <span class="lever"></span>
                            <span class="hide-on-small-only">Dark</span>
                        </label>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col s12 m6 offset-m3">
                <div class="card-panel">
                    <div class="input-field">
                        <input type="text" class="datepicker" id="date-picker" value="{{ today }}">
                        <label for="date-picker">Select Date</label>
                    </div>
                </div>
            </div>
        </div>

        <div id="chickens" class="row">
        </div>

        <div id="summary" class="card-panel">
            <h2 class="center-align">Egg Totals</h2>
            <div class="row">
                <div class="input-field col s12 m6">
                    <input type="text" class="datepicker" id="start-date">
                    <label for="start-date">Start Date</label>
                </div>
                <div class="input-field col s12 m6">
                    <input type="text" class="datepicker" id="end-date">
                    <label for="end-date">End Date</label>
                </div>
            </div>

            <!-- Egg Production Chart -->
            <div id="chart-section" style="margin: 15px 0 30px 0;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-weight: 600; font-size: 1.1rem; color: var(--text-color);">Flock Production</span>
                    <span id="chart-grouping-badge" class="badge" style="margin: 0; background-color: var(--primary-color); color: #fff; font-size: 0.8rem;">Daily</span>
                </div>
                <div class="chart-wrapper" style="position: relative; height: 240px; width: 100%;">
                    <canvas id="eggChart"></canvas>
                </div>
            </div>

            <table id="summary-table" class="striped">
                <thead>
                    <tr>
                        <th>Chicken</th>
                        <th>Total Eggs</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        window.egg_data = {{ egg_data | tojson }};
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Materialize JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>

    <!-- Confirmation Modal Structure -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <h4>Archive Chicken</h4>
            <p>Are you sure you want to retire this chicken? It will no longer appear in the tracker, but all historical egg data will be preserved in the archive.</p>
        </div>
        <div class="modal-footer">
            <a href="#!" class="modal-close waves-effect waves-green btn-flat">Cancel</a>
            <a href="#!" id="confirmDeleteBtn" class="modal-close waves-effect waves-red btn-flat">Retire</a>
        </div>
    </div>

    <!-- Add Chicken Modal Structure -->
    <div id="addChickenModal" class="modal">
        <div class="modal-content">
            <h4>Add New Chicken 🐔</h4>
            <div class="row" style="margin-bottom: 0;">
                <div class="input-field col s12 m6">
                    <input type="text" id="newChickenName" required autocomplete="off" placeholder="e.g. Henrietta">
                    <label for="newChickenName" class="active">Chicken Name</label>
                </div>
                <div class="input-field col s12 m6">
                    <input type="text" class="datepicker" id="newChickenArrivalDate" placeholder="YYYY-MM-DD">
                    <label for="newChickenArrivalDate" class="active">Arrival Date</label>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <a href="#!" class="modal-close waves-effect waves-grey btn-flat">Cancel</a>
            <button type="button" id="confirmAddChickenBtn" class="waves-effect waves-light btn">Add Chicken</button>
        </div>
    </div>
</body>
</html>
